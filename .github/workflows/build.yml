name: Build extension zip

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # only used to attach the zip to a release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip

      - name: Syntax check
        run: for f in extension/*.js; do node --check --input-type=module < "$f" || exit 1; done

      - name: Build zip
        run: make zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screensavers@yofuness.github.io
          path: screensavers@yofuness.github.io.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: screensavers@yofuness.github.io.zip
